
<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Cruz Sublime | V19 Experimental</title>
  <style>
    * { box-sizing: border-box; }
    body {
      margin: 0;
      padding: 25px;
      font-family: Arial, sans-serif;
      color: white;
      background: linear-gradient(135deg, #061b38, #22052f);
    }
    main {
      max-width: 1100px;
      margin: auto;
    }
    h1 { color: #35d8ff; }
    .panel {
      padding: 22px;
      border: 1px solid #ed32b3;
      border-radius: 18px;
      background: #0b1027;
    }
    button {
      padding: 13px 22px;
      margin-top: 15px;
      border: none;
      border-radius: 10px;
      color: white;
      font-weight: bold;
      cursor: pointer;
      background: linear-gradient(90deg, #00c9ff, #ff249f);
    }
    .imagenes {
      display: grid;
      grid-template-columns: repeat(2, minmax(0, 1fr));
      gap: 15px;
      margin-top: 20px;
    }
    .imagen {
      padding: 12px;
      border: 1px solid #435174;
      border-radius: 12px;
      overflow: hidden;
    }
    canvas {
      display: block;
      width: 100%;
      height: auto;
    }
    @media (max-width: 650px) {
      .imagenes { grid-template-columns: 1fr; }
    }
  </style>
  
<script type="module">
  import * as ort from "https://cdn.jsdelivr.net/npm/onnxruntime-web@1.22.0/dist/ort.webgpu.min.mjs";
  window.ortV19 = ort;
  window.dispatchEvent(new Event("ort-v19-ready"));
</script>

</head>
<body>
<main>
  <h1>👑 Cruz Sublime · V19 Experimental</h1>
  <p>Laboratorio independiente de mejora de imágenes con Real-ESRGAN x4. Primera prueba con imágenes pequeñas (máximo 256 px de entrada).</p>

  <section class="panel">
    <label for="archivo">Selecciona una imagen:</label>
    <input id="archivo" type="file" accept="image/*">

    <div>
      <button id="mejorar" disabled>Probar mejora IA x4 (experimental)</button>
      <button id="descargar" disabled>Descargar PNG</button>
    </div>

    <p id="estado" role="status">Esperando imagen...</p>

    <div class="imagenes">
      <div class="imagen">
        <h3>Original</h3>
        <canvas id="original"></canvas>
      </div>
      <div class="imagen">
        <h3>Resultado experimental</h3>
        <canvas id="resultado"></canvas>
      </div>
    </div>
  </section>
</main>

<script>
const archivo = document.getElementById("archivo");
const mejorar = document.getElementById("mejorar");
const descargar = document.getElementById("descargar");
const original = document.getElementById("original");
const resultado = document.getElementById("resultado");
const estado = document.getElementById("estado");
const MODEL_URL = "./static/models/model_fp16.onnx";
const MAX_SIDE = 256; // Prueba segura: limita el uso de memoria.
let imagen = null;
let session = null;
let trabajando = false;

function mensaje(texto) { estado.textContent = texto; }
function detalle(error) { return error?.message || String(error); }

window.addEventListener("ort-v19-ready", () => {
  mensaje("Motor ONNX cargado. Selecciona una imagen para probar IA x4.");
});

archivo.addEventListener("change", async () => {
  mejorar.disabled = true;
  descargar.disabled = true;
  if (imagen) imagen.close();
  imagen = null;
  const file = archivo.files?.[0];
  if (!file) return;
  try {
    imagen = await createImageBitmap(file);
    original.width = imagen.width;
    original.height = imagen.height;
    original.getContext("2d").drawImage(imagen, 0, 0);
    resultado.width = resultado.height = 1;
    mejorar.disabled = false;
    mensaje(`Imagen cargada (${imagen.width} × ${imagen.height}). La prueba IA limitará el lado mayor a ${MAX_SIDE} px.`);
  } catch (e) { mensaje("No se pudo abrir la imagen: " + detalle(e)); }
});

async function iniciarModelo() {
  if (session) return session;
  if (!window.ortV19) throw new Error("ONNX Runtime todavía no cargó. Comprueba tu conexión y recarga la página.");
  const ort = window.ortV19;
  mensaje("Cargando modelo IA (aprox. 34 MB). Puede tardar...");
  // WebGPU primero; WASM como alternativa cuando sea posible.
  const proveedores = navigator.gpu ? ["webgpu", "wasm"] : ["wasm"];
  let ultimoError;
  for (const proveedor of proveedores) {
    try {
      session = await ort.InferenceSession.create(MODEL_URL, {
        executionProviders: [proveedor],
        graphOptimizationLevel: "all"
      });
      console.info("V19 proveedor:", proveedor, "entradas:", session.inputNames, "salidas:", session.outputNames);
      return session;
    } catch (e) {
      ultimoError = e;
      console.warn("V19: fallo con", proveedor, e);
    }
  }
  throw new Error("No se pudo abrir el modelo con WebGPU ni WASM: " + detalle(ultimoError));
}

mejorar.addEventListener("click", async () => {
  if (!imagen || trabajando) return;
  trabajando = true;
  mejorar.disabled = true;
  descargar.disabled = true;
  let inputTensor;
  try {
    const ort = window.ortV19;
    const modelo = await iniciarModelo();
    const ancho = Math.max(1, Math.round(imagen.width * Math.min(1, MAX_SIDE / Math.max(imagen.width, imagen.height))));
    const alto = Math.max(1, Math.round(imagen.height * Math.min(1, MAX_SIDE / Math.max(imagen.width, imagen.height))));
    const temporal = document.createElement("canvas");
    temporal.width = ancho;
    temporal.height = alto;
    const tctx = temporal.getContext("2d", { willReadFrequently: true });
    tctx.drawImage(imagen, 0, 0, ancho, alto);
    const rgba = tctx.getImageData(0, 0, ancho, alto).data;
    const plano = ancho * alto;
    const rgb = new Float32Array(plano * 3);
    for (let i = 0; i < plano; i++) {
      rgb[i] = rgba[i * 4] / 255;
      rgb[plano + i] = rgba[i * 4 + 1] / 255;
      rgb[2 * plano + i] = rgba[i * 4 + 2] / 255;
    }
    inputTensor = new ort.Tensor("float32", rgb, [1, 3, alto, ancho]);
    mensaje("Procesando imagen con IA... No cierres esta pestaña.");
    // Permite que el navegador pinte el mensaje antes de inferencia.
    await new Promise(resolve => requestAnimationFrame(() => setTimeout(resolve, 0)));
    const salida = await modelo.run({ [modelo.inputNames[0]]: inputTensor });
    const tensor = salida[modelo.outputNames[0]];
    const dimensiones = tensor.dims;
    if (dimensiones.length !== 4 || dimensiones[0] !== 1 || dimensiones[1] !== 3) {
      throw new Error("Salida ONNX inesperada: " + JSON.stringify(dimensiones));
    }
    const h = dimensiones[2], w = dimensiones[3];
    const pixeles = tensor.data;
    const total = w * h;
    const datos = new Uint8ClampedArray(total * 4);
    for (let i = 0; i < total; i++) {
      datos[4 * i] = Math.round(Math.max(0, Math.min(1, pixeles[i])) * 255);
      datos[4 * i + 1] = Math.round(Math.max(0, Math.min(1, pixeles[total + i])) * 255);
      datos[4 * i + 2] = Math.round(Math.max(0, Math.min(1, pixeles[2 * total + i])) * 255);
      datos[4 * i + 3] = 255;
    }
    resultado.width = w;
    resultado.height = h;
    resultado.getContext("2d").putImageData(new ImageData(datos, w, h), 0, 0);
    descargar.disabled = false;
    mensaje(`✅ IA ejecutada. Resultado: ${w} × ${h} px. Prueba experimental con límite de entrada de ${MAX_SIDE} px.`);
    tensor.dispose?.();
  } catch (e) {
    console.error("Error V19:", e);
    mensaje("❌ Prueba IA fallida: " + detalle(e));
  } finally {
    inputTensor?.dispose?.();
    trabajando = false;
    mejorar.disabled = !imagen;
  }
});

descargar.addEventListener("click", () => {
  resultado.toBlob(blob => {
    if (!blob) { mensaje("No se pudo crear el PNG."); return; }
    const url = URL.createObjectURL(blob);
    const a = document.createElement("a");
    a.href = url;
    a.download = "CruzSublime_V19_IA_x4.png";
    a.click();
    setTimeout(() => URL.revokeObjectURL(url), 5000);
  }, "image/png");
});
</script>
</body>
</html>
